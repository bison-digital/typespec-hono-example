# The whole configuration a consumer needs. Nothing here is a workaround.
emit:
  - typespec-hono
  - "@typespec/openapi3"
  - typespec-openapi-document
options:
  typespec-hono:
    emitter-output-dir: "{project-root}/src/generated"
    runtime-module: "../runtime.js"
    seal-object-schemas: true
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/openapi"
    file-type: json
  typespec-openapi-document:
    emitter-output-dir: "{project-root}/src/generated"
